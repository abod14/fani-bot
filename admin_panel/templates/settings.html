{% extends "base.html" %}
{% block title %}الإعدادات — لوحة تحكم «فني»{% endblock %}
{% block content %}
<h1>الإعدادات العامة</h1>
<p class="muted">أي تعديل هنا يُطبّق فورًا على البوت بدون الحاجة لإعادة تشغيله.</p>

<div class="card">
  <form method="post">
    <div class="field">
      <label>سعر الاشتراك الشهري (ريال سعودي — Tap)</label>
      <input type="number" step="0.01" min="0" name="subscription_price_sar" value="{{ settings.subscription_price_sar }}" required>
    </div>
    <br>
    <div class="field">
      <label>سعر الاشتراك الشهري (نجوم تلغرام — Stars)</label>
      <input type="number" step="1" min="1" name="subscription_price_stars" value="{{ settings.subscription_price_stars }}" required>
    </div>
    <br>
    <div class="field">
      <label>مدة الاشتراك (بالأيام)</label>
      <input type="number" step="1" min="1" name="subscription_days" value="{{ settings.subscription_days }}" required>
    </div>
    <br>
    <div class="field">
      <label>عدد الفرص المجانية قبل طلب الاشتراك</label>
      <input type="number" step="1" min="0" name="free_contacts_limit" value="{{ settings.free_contacts_limit }}" required>
    </div>
    <br>
    <div class="field">
      <label>الدول المفتوحة بالبوت (للتسجيل والبحث)</label>
      {% for c in all_countries %}
      <label style="font-weight: normal;">
        <input type="checkbox" name="country_{{ c.code }}" value="1"
               {{ 'checked' if c.code in enabled_countries }} {{ 'disabled checked' if c.code == 'SA' }}>
        {{ c.flag }} {{ c.name.ar }}{% if c.code == 'SA' %} (دائمًا مفتوحة){% else %} — الدفع بالنجوم فقط{% endif %}
      </label>
      {% endfor %}
    </div>
    <br>
    <button type="submit">حفظ الإعدادات</button>
  </form>
</div>
{% endblock %}
