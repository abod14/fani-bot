h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.4;margin:28px 0 4px}
.lead{color:var(--muted);margin:0 0 20px}

.num{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--brand-deep);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}

input[type=text],input[type=search],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input:focus,select:focus{border-color:var(--brand);outline:none}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;background:#fff;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--tint);border-color:var(--brand);color:var(--brand-deep);font-weight:600}
.chip input:checked+span::before{content:"✓ "}
.chip input:disabled+span{opacity:.4;cursor:not-allowed}
.chip input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.dbox{max-height:300px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.count{font-size:14px;color:var(--muted);margin:8px 0 0}
.count b{color:var(--brand-deep)}
.whole{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-weight:600}
.whole input{width:20px;height:20px;accent-color:var(--brand)}
.err{background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:15px 20px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;text-decoration:none}

    var ps=d.professions.filter(function(p){return !qq||p.id===v||nrm(p.name).indexOf(qq)>-1||nrm(d.name).indexOf(qq)>-1});
    if(!ps.length)return;
    html+='<optgroup label="'+esc(d.name)+'">'+ps.map(function(p){if(p.id!==v){n++;only=p.id}return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join("")+'</optgroup>';
  });
  sel.innerHTML=html;
  if(v&&sel.querySelector('option[value="'+v+'"]'))sel.value=v;
  if(qq&&n===1&&!v){sel.value=only;sel.onchange()}
}
function fillDomains(){fillProf($("prof1"),$("q1").value);fillProf($("prof2"),$("q2").value)}
$("q1").oninput=function(){fillProf($("prof1"),this.value)};
$("q2").oninput=function(){fillProf($("prof2"),this.value)};
$("prof1").onchange=$("prof2").onchange=function(){renderSvcs();renderWhole()};
$("add2").onclick=function(){$("p2box").hidden=false;this.hidden=true};
$("rm2").onclick=function(){$("p2box").hidden=true;$("add2").hidden=false;$("q2").value="";$("prof2").value="";fillProf($("prof2"),"");renderSvcs();renderWhole()};

// ── الخدمات
function selectedSvcs(){return [].map.call(document.querySelectorAll("#svcs input:checked"),function(i){return i.value})}
function renderSvcs(){
  var keep=selectedSvcs(),seen={},list=[];
  [$("prof1").value,$("p2box").hidden?"":$("prof2").value].forEach(function(id){var p=prof(id);if(p)p.services.forEach(function(s){if(!seen[s.ar]){seen[s.ar]=1;list.push(s)}})});
  $("svcs").innerHTML=list.map(function(s){return '<label class="chip"><input type="checkbox" value="'+esc(s.ar)+'"'+(keep.indexOf(s.ar)>-1?" checked":"")+'><span>'+esc(s.name)+'</span></label>'}).join("");
  $("svcCard").hidden=!list.length;
}
$("svcAll").onclick=function(){[].forEach.call(document.querySelectorAll("#svcs input"),function(i){i.checked=true})};

// ── المكان
function wide(){var a=prof($("prof1").value),b=$("p2box").hidden?null:prof($("prof2").value);return !!((a&&a.wide)||(b&&b.wide))}
function renderWhole(){$("wholeRow").hidden=!wide();if(!wide())$("whole").checked=false;$("distPick").style.opacity=$("whole").checked?.35:1}
$("whole").onchange=renderWhole;
function loadRegions(){
  var c=$("ctry").value||"SA";opts($("region"),[]);opts($("city"),[]);$("distBox").hidden=true;$("noDist").hidden=true;
  getJSON("regions?country="+encodeURIComponent(c)).then(function(j){opts($("region"),j.regions)});
}
$("ctry").onchange=loadRegions;
$("region").onchange=function(){
  opts($("city"),[]);$("distBox").hidden=true;$("noDist").hidden=true;state.cities=[];
  if(!this.value)return;
  getJSON("cities?region="+this.value).then(function(j){state.cities=j.cities;opts($("city"),j.cities)});
};
$("city").onchange=function(){
  $("distBox").hidden=true;$("noDist").hidden=true;$("dists").innerHTML="";state.d=[];updCount();
  var c=(state.cities||[]).filter(function(x){return String(x.id)===$("city").value})[0];
  if(!c)return;
  if(!c.has_d){$("noDist").hidden=false;return}
  getJSON("districts?city="+c.id).then(function(j){
    $("dists").innerHTML=j.districts.map(function(d){return '<label class="chip" data-n="'+esc(d.name)+'"><input type="checkbox" value="'+d.id+'"><span>'+esc(d.name)+'</span></label>'}).join("");
    $("distBox").hidden=false;renderWhole();updCount();
  });
};
$("dists").addEventListener("change",updCount);
function updCount(){
  var sel=[].filter.call(document.querySelectorAll("#dists input"),function(i){return i.checked});
  $("dcount").textContent=sel.length;
  [].forEach.call(document.querySelectorAll("#dists input"),function(i){i.disabled=!i.checked&&sel.length>=MAX});
}
$("dsearch").oninput=function(){var q=this.value.trim();
  [].forEach.call(document.querySelectorAll("#dists .chip"),function(l){l.hidden=!!q&&l.dataset.n.indexOf(q)<0&&!l.querySelector("input").checked})};

// ── الإرسال
function showErr(m){$("err").textContent=m;$("err").hidden=!m;if(m)$("err").scrollIntoView({behavior:"smooth",block:"center"})}
$("form").onsubmit=function(e){
  e.preventDefault();showErr("");
  var name=$("name").value.trim(), cityOk=!!$("city").value;
  if(!name)return showErr(t("e_name"));
  if(!$("prof1").value)return showErr(t("e_prof"));
  if(!cityOk)return showErr(t("e_city"));
  var dists=[].map.call(document.querySelectorAll("#dists input:checked"),function(i){return +i.value});
  var whole=$("whole").checked&&wide();
  if(!$("distBox").hidden&&!whole&&!dists.length)return showErr(t("e_dist"));
  var body={lang:L,name:name,pid:$("prof1").value,p2id:$("p2box").hidden?"":$("prof2").value,services:selectedSvcs(),
            city_id:+$("city").value,districts:dists,whole:whole};
  $("go").disabled=true;$("go").textContent=t("sending");
  fetch(API+"submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){return r.json()}).then(function(j){
     if(!j.ok)return showErr(j.error||t("net"));
     var p1=prof(body.pid),p2=prof(body.p2id),cityName=$("city").selectedOptions[0].textContent;
     var where=whole||$("distBox").hidden?t("whole_city"):dists.map(function(id){return document.querySelector('#dists input[value="'+id+'"]').parentNode.dataset.n}).join("، ");
     var svcNames=[].map.call(document.querySelectorAll("#svcs input:checked"),function(i){return i.nextSibling.textContent});
     $("sum").innerHTML="<li><b>"+esc(t("l_name"))+"</b> "+esc(name)+"</li><li><b>"+esc(t("l_prof"))+"</b> "+esc(p1.name+(p2?" • "+p2.name:""))+"</li>"
       +(svcNames.length?"<li><b>"+esc(t("l_svc"))+"</b> "+esc(svcNames.join("، "))+"</li>":"")
       +"<li><b>"+esc(t("l_place"))+"</b> "+esc(cityName+" — "+where)+"</li>";
     $("waBtn").href=j.wa_url;$("code").textContent=j.code;
     $("form").hidden=true;$("done").hidden=false;window.scrollTo({top:0,behavior:"smooth"});
   }).catch(function(){showErr(t("net"))})
   .then(function(){$("go").disabled=false;$("go").textContent=t("next")});
};
$("back").onclick=function(){$("done").hidden=true;$("form").hidden=false};

// ── اللغة
function setLang(l){
  L=T[l]?l:"ar";try{localStorage.setItem("fanni_lang",L)}catch(e){}
  texts();
  getJSON("meta?lang="+L).then(function(j){
    var first=!M;M=j;MAX=j.max_districts||5;$("dmax").textContent=MAX;
    fillDomains();renderSvcs();
    if(first){opts($("ctry"),j.countries.map(function(c){return {id:c.code,name:c.name}}));
      $("ctry").value=j.countries[0]?j.countries[0].code:"SA";$("ctryBox").hidden=j.countries.length<2;loadRegions();}
    else{var v=$("ctry").value;opts($("ctry"),j.countries.map(function(c){return {id:c.code,name:c.name}}));$("ctry").value=v}
  }).catch(function(){showErr(t("net"))});
}
[].forEach.call(document.querySelectorAll(".langs button"),function(b){b.onclick=function(){setLang(b.dataset.l)}});
var saved=null;try{saved=new URLSearchParams(location.search).get("lang")||localStorage.getItem("fanni_lang")}catch(e){}
setLang(saved||"ar");
})();
</script>
</body>
</html>
